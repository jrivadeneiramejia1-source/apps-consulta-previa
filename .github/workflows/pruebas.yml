# Pruebas automáticas: corren solas cada vez que se sube un cambio (pestaña Actions del repositorio).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Código, enlaces y apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium
      - name: Revisar el código (ESLint)
        run: npm run lint
      - name: Enlaces y archivos que guarda cada sw.js
        run: npm run enlaces
      - name: Pruebas de las apps (Playwright + axe)
        run: npm run pruebas
        env:
          CAPTURAS: capturas
      - name: Capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: capturas
          retention-days: 7
          if-no-files-found: ignore

  reglas:
    name: Reglas de Firestore (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run reglas

  lighthouse:
    name: Lighthouse (solo avisa)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lighthouse
      - name: Informes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
